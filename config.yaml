# Single place to switch providers. Only src/config.py reads the provider section.
provider: ollama            # ollama | bedrock (Stage 6)

ollama:
  llm_model: qwen2.5:7b
  embed_model: nomic-embed-text
  base_url: http://localhost:11434

bedrock:                    # Stage 6
  region: ap-southeast-2
  llm_model: anthropic.claude-haiku   # confirm exact model ID in the Bedrock console
  embed_model: amazon.titan-embed-text-v2:0

ingest:
  raw_dir: data/raw
  ocr_dir: data/ocr         # cached OCR text for scanned pages, one .txt per page
  chroma_dir: data/chroma
  collection: philhealth
  chunk_size: 700            # experimenting (was 200); record results in LEARNING_LOG
  chunk_overlap: 100          # skeleton: fixed chunks; upgrade 1 adds overlap
  list_aware_split: true
  abbreviations:            # B1: abbreviation -> full form
    PRO: PhilHealth Regional Office
    PROs: PhilHealth Regional Offices
    ACPS: Auto Credit Payment Scheme

graph:
  max_retries: 2
  fallback_message: "Insufficient policy data to confirm."

retrieval:
  mode: hybrid          # vector | hybrid   (switch back to compare)
  candidates_k: 10      # how many each search returns before fusing
  top_k: 4              # how many go to the LLM
  rrf_k: 60             # RRF constant
  fused_k: 10           # NEW: how many fused chunks go to the reranker

rerank:
  enabled: false         # false = old behaviour, for comparison runs
  model: BAAI/bge-reranker-base